# GitHub Actions 工作流程文件
name: 自动部署为 GitPage 静态网站

on:
  push:
    branches: [master] # 当推送到 master 分支时触发
  workflow_dispatch: # 允许手动触发

# 官方 actions/deploy-pages 需要的权限
permissions:
  contents: read
  pages: write
  id-token: write

# 避免同时部署冲突
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # 构建 job
  build:
    name: 构建 Vite 前端站点
    runs-on: ubuntu-latest

    steps:
      - name: 1、检出代码
        uses: actions/checkout@v4

      - name: 2、安装 pnpm
        uses: pnpm/action-setup@v4
        # 不传 version，自动读取 package.json 的 packageManager 字段（pnpm@10.34.5）

      - name: 3、安装 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm' # 自动缓存 pnpm 依赖，大幅提速

      - name: 4、安装依赖
        run: pnpm install --frozen-lockfile

      - name: 5、构建 Vite 前端站点
        run: pnpm run build
        env:
          # GitHub Pages 的站点路径是 https://<user>.github.io/<仓库名>/，
          # 用仓库名覆盖本地 .env 的 VITE_PUBLIC_PATH，保证资源与路由 base 正确
          VITE_PUBLIC_PATH: /${{ github.event.repository.name }}/

      # SPA 路由 history 模式的刷新/直链兜底：Pages 找不到路径时回落到 404.html
      - name: 6、生成 SPA 兜底页
        run: cp dist/index.html dist/404.html

      - name: 7、上传构建产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # 部署 job
  deploy:
    name: 部署到 GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
