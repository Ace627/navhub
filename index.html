<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>%VITE_APP_TITLE%</title>
    <!-- 引入应用图标 -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <!-- 统计 SDK：保持静态同步标签，动态创建（缺 id 等属性）会让 SDK 内部读取配置时抛错 -->
    <script charset="UTF-8" id="LA_COLLECT" src="//sdk.51.la/js-sdk-pro.min.js"></script>
    <script>
      ;(() => {
        try {
          // 读取本地持久化的主题设置，供白屏阶段暗色适配
          const settingJson = localStorage.getItem('%VITE_STORAGE_PREFIX%systemSetting')
          if (settingJson && JSON.parse(settingJson).value?.theme === 'dark') document.documentElement.classList.add('dark')

          // 接入网站统计：等路由就绪、页面标题定稿后再初始化，避免首报记录到默认标题；
          // 标题始终为默认值（动态标题被关闭）时按 5 秒兜底放行，保证统计不丢；
          // hashMode 须与路由模式一致，本项目为 history 模式，故为 false
          const defaultTitle = '%VITE_APP_TITLE%'
          let tries = 0
          const timer = setInterval(() => {
            // 标题已定稿（离开默认值）或轮询满 5 秒兜底，即认为就绪
            const settled = document.title !== defaultTitle || ++tries >= 25
            if (!settled) return
            clearInterval(timer)
            initStats(3)
          }, 200)

          /**
           * 初始化统计并加载访问数据挂件
           *
           * 挂件脚本依赖 SDK 完成初始化才能注入数据容器（关于页访问图表的数据源），
           * 必须在 LA.init 之后加载，否则容器永不出现、图表无数据；
           * SDK 静态加载若被拦截扩展屏蔽导致 LA 未定义，间隔 2 秒重试，用尽后安静放弃
           *
           * @param retries 剩余重试次数
           */
          function initStats(retries) {
            if (typeof LA === 'undefined') {
              if (retries > 0) setTimeout(() => initStats(retries - 1), 2000)
              return
            }
            LA.init({ id: '3RO01mRk8aVlubuI', ck: '3RO01mRk8aVlubuI', autoTrack: true, hashMode: false })
            const widget = document.createElement('script')
            widget.id = 'LA-DATA-WIDGET'
            widget.crossOrigin = 'anonymous'
            widget.charset = 'UTF-8'
            widget.src = 'https://v6-widget.51.la/v6/3RO01mRk8aVlubuI/quote.js?theme=0&f=12&display=0,1,1,1,1,1,1,1'
            document.body.appendChild(widget)
          }
        } catch {}
      })()
    </script>
    <!-- 引入浏览器重置样式表 -->
    <link rel="stylesheet" href="/css/reset.css" />
    <link rel="stylesheet" href="/css/scrollbar.css" />
    <link rel="stylesheet" href="/css/app-loading.css" />
  </head>
  <body>
    <!-- VueJS 挂载的 DOM 容器 -->
    <div id="app">
      <!-- 白屏阶段会执行的 CSS 加载动画 -->
      <div class="app-loading">
        <div class="app-loading-wrap">
          <img src="/favicon.png" class="app-loading-logo" alt="Logo" />
          <div class="app-loading-item">
            <div class="app-loading-outter"></div>
            <div class="app-loading-inner"></div>
          </div>
          <div class="app-loading-title">%VITE_APP_TITLE%</div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
