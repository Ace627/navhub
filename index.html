<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>%VITE_APP_TITLE%</title>
    <!-- 引入应用图标 -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <!-- 统计 SDK：保持静态同步标签，动态创建（缺 id 等属性）会让 SDK 内部读取配置时抛错 -->
    <script charset="UTF-8" id="LA_COLLECT" src="//sdk.51.la/js-sdk-pro.min.js"></script>
    <script>
      ;(() => {
        try {
          // 读取本地持久化的主题设置，供白屏阶段暗色适配
          const settingJson = localStorage.getItem('%VITE_STORAGE_PREFIX%systemSetting')
          if (settingJson && JSON.parse(settingJson).value?.theme === 'dark') document.documentElement.classList.add('dark')

          // 接入网站统计
          LA.init({ id: '3RO01mRk8aVlubuI', ck: '3RO01mRk8aVlubuI', autoTrack: true, hashMode: false })
        } catch {}
      })()
    </script>
    <!-- 引入浏览器重置样式表 -->
    <link rel="stylesheet" href="/css/reset.css" />
    <link rel="stylesheet" href="/css/scrollbar.css" />
    <link rel="stylesheet" href="/css/app-loading.css" />
  </head>
  <body>
    <!-- VueJS 挂载的 DOM 容器 -->
    <div id="app">
      <!-- 白屏阶段会执行的 CSS 加载动画 -->
      <div class="app-loading">
        <div class="app-loading-wrap">
          <img src="/favicon.png" class="app-loading-logo" alt="Logo" />
          <div class="app-loading-item">
            <div class="app-loading-outter"></div>
            <div class="app-loading-inner"></div>
          </div>
          <div class="app-loading-title">%VITE_APP_TITLE%</div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
